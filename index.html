<!DOCTYPE html>
<html>
<head>
    <title>What-If Wallet</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>💰 What-If Wallet</h1>
        <p>See how today's money decisions affect your future.</p>
    </header>

    <div class="card">
        <h2>💳 Your Finances</h2>

        <label>Monthly Income</label>
        <input type="number" id="income" placeholder="30000">

        <label>Monthly Expenses</label>
        <input type="number" id="expenses" placeholder="20000">

        <button onclick="analyze()">Analyze My Money</button>

        <h3>Monthly Savings: ₹<span id="savings">0</span></h3>
    </div>

    <div class="card">
        <h2>🔮 What If?</h2>

        <label>Scenario</label>

        <select id="scenario">
            <option value="extra">Extra Monthly Expense</option>
            <option value="income">Income Increase</option>
            <option value="purchase">Big Purchase</option>
            <option value="emergency">Emergency Expense</option>
        </select>

        <label>Amount</label>
        <input type="number" id="scenarioAmount" placeholder="2000">

        <button onclick="runScenario()">Simulate Scenario</button>
    </div>

    <div class="card">
        <h2>📊 Result</h2>

        <p>Current Savings: ₹<span id="currentResult">0</span></p>

        <p>New Monthly Savings: ₹<span id="newSavings">0</span></p>

        <p>12-Month Impact: ₹<span id="impact">0</span></p>
    </div>

</div>

<script>

function analyze() {

    let income = Number(document.getElementById("income").value);
    let expenses = Number(document.getElementById("expenses").value);

    let savings = income - expenses;

    document.getElementById("savings").textContent = savings;
}


function runScenario() {

    let income = Number(document.getElementById("income").value);
    let expenses = Number(document.getElementById("expenses").value);
    let amount = Number(document.getElementById("scenarioAmount").value);

    let scenario = document.getElementById("scenario").value;

    if (!income || !expenses || !amount) {
        alert("Please enter all values");
        return;
    }

    let currentSavings = income - expenses;

    let newSavings = currentSavings;
    let impact = 0;

    if (scenario === "extra") {
        newSavings = currentSavings - amount;
        impact = -amount * 12;
    }

    else if (scenario === "income") {
        newSavings = currentSavings + amount;
        impact = amount * 12;
    }

    else if (scenario === "purchase") {
        impact = -amount;
    }

    else if (scenario === "emergency") {
        impact = -amount;
    }

    document.getElementById("currentResult").textContent = currentSavings;

    document.getElementById("newSavings").textContent = newSavings;

    document.getElementById("impact").textContent = impact;
}

</script>

</body>
</html>
